query GetOrderForDss($id: ID!) {
  order(id: $id) {
    id
    name
    # Protected customer data, like the shipping address: a public app may only read it with Shopify's approval.
    email
    createdAt
    totalPriceSet {
      shopMoney {
        amount
        currencyCode
      }
    }
    displayFinancialStatus
    displayFulfillmentStatus
    shippingAddress {
      firstName
      lastName
      address1
      address2
      city
      province
      provinceCode
      countryCodeV2
      zip
      phone
    }
    lineItems(first: 100) {
      edges {
        node {
          id
          quantity
          name
          title
          originalUnitPriceSet {
            shopMoney {
              amount
            }
          }
          variant {
            legacyResourceId
          }
        }
      }
    }
    fulfillmentOrders(first: 50) {
      edges {
        node {
          id
          status
          lineItems(first: 100) {
            edges {
              node {
                id
                remainingQuantity
                variant {
                  legacyResourceId
                }
              }
            }
          }
        }
      }
    }
    fulfillments(first: 50) {
      id
      # A cancelled fulfillment keeps its tracking number, so it has to be told apart from a live one.
      status
      trackingInfo {
        number
      }
    }
  }
}
