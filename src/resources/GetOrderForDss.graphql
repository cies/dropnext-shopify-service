query GetOrderForDss($id: ID!) {
  order(id: $id) {
    id
    name
    # Not mapped into the monolith order: kept in the snapshot for discoverability. Like the shipping address, it is
    # protected customer data, which a public app may only read with Shopify's approval.
    email
    legacyResourceId
    createdAt
    totalPriceSet {
      shopMoney {
        amount
        currencyCode
      }
    }
    displayFinancialStatus
    displayFulfillmentStatus
    shippingAddress {
      firstName
      lastName
      address1
      address2
      city
      province
      provinceCode
      countryCodeV2
      zip
      phone
    }
    lineItems(first: 100) {
      edges {
        node {
          id
          quantity
          name
          title
          originalUnitPriceSet {
            shopMoney {
              amount
            }
          }
          variant {
            id
            legacyResourceId
          }
        }
      }
    }
    fulfillmentOrders(first: 50) {
      edges {
        node {
          id
          status
          lineItems(first: 100) {
            edges {
              node {
                id
                remainingQuantity
                totalQuantity
                variant {
                  id
                  legacyResourceId
                }
              }
            }
          }
        }
      }
    }
    fulfillments(first: 50) {
      id
      legacyResourceId
      # A cancelled fulfillment keeps its tracking number, so it has to be told apart from a live one.
      status
      trackingInfo {
        number
      }
    }
  }
}
