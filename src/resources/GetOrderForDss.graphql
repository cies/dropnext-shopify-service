query GetOrderForDss(
  $id: ID!
  $lineItemsFirst: Int!
  $fulfillmentOrdersFirst: Int!
  $fulfillmentOrderLineItemsFirst: Int!
  $fulfillmentsFirst: Int!
) {
  order(id: $id) {
    id
    name
    # Protected customer data, like the shipping address: a public app may only read it with Shopify's approval.
    email
    createdAt
    totalPriceSet {
      shopMoney {
        amount
        currencyCode
      }
    }
    displayFinancialStatus
    displayFulfillmentStatus
    shippingAddress {
      firstName
      lastName
      address1
      address2
      city
      province
      provinceCode
      countryCodeV2
      zip
      phone
    }
    lineItems(first: $lineItemsFirst) {
      pageInfo {
        hasNextPage
      }
      edges {
        node {
          id
          quantity
          name
          title
          originalUnitPriceSet {
            shopMoney {
              amount
            }
          }
          variant {
            legacyResourceId
          }
          # Lets the monolith hold a line for a variant it has not mirrored yet, and fetch the product afterwards.
          # Asked of the line rather than of its variant, so the variant stays the one type the fulfillment orders share.
          product {
            legacyResourceId
          }
        }
      }
    }
    fulfillmentOrders(first: $fulfillmentOrdersFirst) {
      pageInfo {
        hasNextPage
      }
      edges {
        node {
          id
          status
          lineItems(first: $fulfillmentOrderLineItemsFirst) {
            pageInfo {
              hasNextPage
            }
            edges {
              node {
                id
                remainingQuantity
                variant {
                  legacyResourceId
                }
              }
            }
          }
        }
      }
    }
    fulfillments(first: $fulfillmentsFirst) {
      id
      # A cancelled fulfillment keeps its tracking number, so it has to be told apart from a live one.
      status
      trackingInfo {
        number
      }
    }
  }
}
