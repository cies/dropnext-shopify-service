query GetProductById($id: ID!, $mediaFirst: Int!, $variantsFirst: Int!, $variantsAfter: String) {
  shop {
    currencyCode
  }
  product(id: $id) {
    legacyResourceId
    title
    description
    descriptionHtml
    vendor
    productType
    tags
    handle
    status
    publishedAt
    createdAt
    updatedAt
    media(first: $mediaFirst) {
      pageInfo {
        hasNextPage
      }
      edges {
        node {
          __typename
          ... on MediaImage {
            image {
              url
            }
          }
          # Not read, but selected: the generated client cannot decode a `__typename` it has no class for, so without
          # these a product with a video or a 3D model would not decode and never reach the monolith.
          ... on Video {
            id
          }
          ... on ExternalVideo {
            id
          }
          ... on Model3d {
            id
          }
        }
      }
    }
    variants(first: $variantsFirst, after: $variantsAfter) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          legacyResourceId
          title
          sku
          barcode
          price
          selectedOptions {
            name
            value
          }
          media(first: 1) {
            edges {
              node {
                __typename
                ... on MediaImage {
                  image {
                    url
                  }
                }
                # Not read, but selected: the generated client cannot decode a `__typename` it has no class for, so without
                # these a product with a video or a 3D model would not decode and never reach the monolith.
                ... on Video {
                  id
                }
                ... on ExternalVideo {
                  id
                }
                ... on Model3d {
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}
