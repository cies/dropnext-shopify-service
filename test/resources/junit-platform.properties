# Test classes run concurrently, the methods within a class sequentially. What makes that safe, and what a new test
# must keep true (`.claude/rules/tests.md`, "Parallelism"): every fake is a per-test instance, every fake server binds
# port 0, and a test that reads the root logger (`capturingLogs`, a Logback appender, `System.setErr`) declares
# `@ResourceLock(GLOBAL_LOG_REGISTRY)`, JUnit's global lock, so it runs alone: every other test writes to that logger.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# One worker per core: the suite is CPU-bound (Konsist parses the sources, Ktor and OkHttp warm up) and has no
# database to wait on, so more workers than cores would only contend.
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1

# Hand the known-slow classes to the pool first, so the longest one does not define the tail on its own.
junit.jupiter.testclass.order.default=dropnext.dss.testutil.helper.SlowestClassesFirstOrderer
